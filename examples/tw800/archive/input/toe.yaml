    exposedTo: local-technician, connected-serial-equipment, optional-digital-I/O
    id: interface-4
    kind: serial
    name: Serial console and optional serial/I/O interfaces
    sort: 3
  - description: HTTP/HTTPS WebUI, Telnet/SSH CLI, SNMP, external AAA and syslog, subject to configurable service and source ACL restrictions. Firmware/configuration imports, diagnostics and optional Python application/IDE debug functions are exposed through administration. A separate fleet-management channel is unverified.
    exposedTo: administrator, management-network, external-AAA-and-syslog-services
    id: interface-5
    kind: network
    name: Network administration and monitoring
    sort: 4
  - description: Wide-range DC power input terminal block, supporting 12 V to 48 V DC for flexible substation power supply integration
    exposedTo: power-infrastructure
    id: interface-6
    kind: physical
    name: DC Power Input (12–48 V)
    sort: 5
  - description: Status LEDs, physical factory-reset control and SIM slots. Local service access can reset configuration or alter subscriber identity; variant-specific serial/I/O connections are documented separately. These interfaces are reachable by persons with physical access to the router.
    exposedTo: operator, field-technician
    id: interface-7
    kind: physical
    name: Physical service and status interfaces
    sort: 6
