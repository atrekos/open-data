    id: interface-1
    kind: radio
    name: Cellular WAN and SMS interface
    sort: 0
  - description: RJ45 connections for local operational equipment and optional Ethernet WAN uplink. Port count and speed depend on the selected hardware variant. Includes routed, switched and forwarded traffic and exposed management services.
    exposedTo: substation-lan, ieds, rtus
    id: interface-2
    kind: network
    name: Ethernet LAN/WAN interfaces
    sort: 1
  - description: Logical VPN tunnel interfaces over the cellular WAN link to the DSO control center VPN concentrator
    exposedTo: control-center, scada-master, vpn-concentrator
